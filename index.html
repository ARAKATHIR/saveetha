<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jegadeesh K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1f3f8;
    --ink: #14213d;
    --muted: #5b6478;
    --card: #ffffff;
    --line: #d5dae6;
    --accent: #0f766e;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1424;
      --ink: #eef1f8;
      --muted: #9aa4bb;
      --card: #172038;
      --line: #2a3555;
      --accent: #2dd4bf;
      --accent-ink: #0e1424;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 {
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0 0 12px;
  }
  .sub { color: var(--muted); margin: 0 0 32px; font-size: 1.05rem; }
  .search {
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .search:focus-visible, .page-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .page-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 22px;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    font-size: 1.15rem;
    font-weight: 600;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .page-btn:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .page-btn .go { font-weight: 400; opacity: .7; }
  .empty { color: var(--muted); padding: 24px 0; }
  @media (prefers-reduced-motion: reduce) { .page-btn { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Jegadeesh K</h1>
  <p class="sub">Pick a topic to open it.</p>

  <input class="search" id="search" type="search" placeholder="Search topics" aria-label="Search topics">
  <div class="list" id="list"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<script>
  /* Topics are stored in topics.json. Use admin.html to add or remove them. */
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const search = document.getElementById("search");
  let pages = [];

  function render(filter = "") {
    const q = filter.trim().toLowerCase();
    list.innerHTML = "";
    const shown = pages.filter(p => p.title.toLowerCase().includes(q));
    shown.forEach(p => {
      const a = document.createElement("a");
      a.className = "page-btn";
      a.href = p.file;
      const t = document.createElement("span");
      t.textContent = p.title;
      const go = document.createElement("span");
      go.className = "go";
      go.textContent = "Open";
      a.append(t, go);
      list.appendChild(a);
    });
    empty.textContent = pages.length ? "No topic matches your search." : "No topics yet.";
    empty.hidden = shown.length > 0;
  }

  search.addEventListener("input", e => render(e.target.value));

  fetch("topics.json?v=" + Date.now())
    .then(r => { if (!r.ok) throw new Error("load"); return r.json(); })
    .then(data => { pages = data; render(search.value); })
    .catch(() => {
      empty.textContent = "Could not load topics. Please refresh the page.";
      empty.hidden = false;
    });
</script>
</body>
</html>
